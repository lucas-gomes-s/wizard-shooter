name: Mobile Godot smoke
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-smoke.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import project
        run: |
          set -o pipefail
          timeout 90 Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Domain and atlas tests
        run: |
          set -o pipefail
          timeout 90 Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --script tests/smoke.gd 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/smoke.log; then exit 1; fi
      - name: Persistence and recovery tests
        run: |
          set -o pipefail
          timeout 90 Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --script tests/persistence.gd 2>&1 | tee /tmp/persistence.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/persistence.log; then exit 1; fi
      - name: Launch main scene
        run: |
          set -o pipefail
          timeout 45 Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --quit-after 20 2>&1 | tee /tmp/launch.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/launch.log; then exit 1; fi
  android-alpha:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Godot and Android template
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -o /tmp/templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$dest"
          unzip -j /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt -d "$dest"
      - name: Install Android command-line tools
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Configure Android SDK and debug signing
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wizard Shooter Debug"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME/.android/debug.keystore" > "$HOME/.config/godot/editor_settings-4.5.tres"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import and export debug APK
        run: |
          set -o pipefail
          mkdir -p mobile/export
          Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --import
          Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --export-debug "Android Alpha" export/wizard-shooter-alpha.apk 2>&1 | tee /tmp/android-export.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to export|Export failed' /tmp/android-export.log; then exit 1; fi
          test -s mobile/export/wizard-shooter-alpha.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose mobile/export/wizard-shooter-alpha.apk
          unzip -Z1 mobile/export/wizard-shooter-alpha.apk | grep -E 'assets/.*\.pck|assets/project.binary|assets/.*manifest.json'
      - name: Upload Android alpha
        uses: actions/upload-artifact@v4
        with:
          name: wizard-shooter-alpha-android
          path: mobile/export/wizard-shooter-alpha.apk
          if-no-files-found: error
          retention-days: 14
