name: Mobile six-minute expedition benchmark
on:
  push:
    paths:
      - 'mobile/gameplay/expedition_schedule.gd'
      - 'mobile/domain/training_economy.gd'
      - '.github/workflows/mobile-expedition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expedition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Exploratory six-minute matrix
        run: |
          set -euo pipefail
          Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --script tools/balance_benchmark.gd -- --preset=expedition-six --all-bodies --seeds=2 --seed-start=310000019 --seconds=540 --output=/tmp/expedition.json 2>&1 | tee /tmp/expedition.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/expedition.log; then exit 1; fi
          python - <<'PY'
          import json, statistics
          d=json.load(open("/tmp/expedition.json"))
          assert len(d["runs"])==216 and len(d["groups"])==108 and d["phased_expedition"]
          result={}
          for level in (1,2,3):
              for strategy in ("stationary","aggressive","kiting","explorer"):
                  rows=[r for r in d["runs"] if r["difficulty"]==level and r["strategy"]==strategy]
                  assert len(rows)==18
                  result[f"D{level}/{strategy}"]={"n":len(rows),"win":sum(r["outcome"]=="Victory" for r in rows)/len(rows),"boss_reach":sum(r["boss_reached"] for r in rows)/len(rows),"timeout":sum(r["outcome"]=="Timeout" for r in rows)/len(rows),"mean_seconds":statistics.mean(r["seconds"] for r in rows),"mean_training":statistics.mean(r["training_xp"] for r in rows),"mean_apprentice":statistics.mean(r["apprentice_xp"] for r in rows),"mean_essence":statistics.mean(r["essence_reward"] for r in rows),"mean_legacy_training":statistics.mean(r["legacy_training_xp"] for r in rows),"mean_peak_enemies":statistics.mean(r["peak_enemies"] for r in rows)}
          print(json.dumps(result,indent=2))
          with open("/tmp/expedition-summary.json","w") as f: json.dump(result,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wizard-shooter-six-minute-exploratory
          path: |
            /tmp/expedition.json
            /tmp/expedition-summary.json
          if-no-files-found: error
          retention-days: 30
