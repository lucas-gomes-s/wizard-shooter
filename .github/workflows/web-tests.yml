name: Web game regression tests
on:
  push:
    paths:
      - 'js/**'
      - 'index.html'
      - 'package.json'
      - 'tests/web/**'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'index.html'
      - 'package.json'
      - 'tests/web/**'
      - '.github/workflows/web-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
