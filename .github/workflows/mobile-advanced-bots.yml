name: Mobile advanced policy comparison
on:
  push:
    paths:
      - 'mobile/tools/advanced_bots.gd'
      - '.github/workflows/mobile-advanced-bots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        body: [stoneborn, fae, hybrid]
        cohort: [legacy-controlled, advanced-controlled, advanced-generated]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Run paired policy or generated cohort
        env:
          COHORT: ${{ matrix.cohort }}
          BODY: ${{ matrix.body }}
        run: |
          set -euo pipefail
          Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --check-only --script tools/advanced_bots.gd
          Godot_v4.5.1-stable_linux.x86_64 --headless --path mobile --script tools/balance_benchmark.gd -- --preset=expedition-artifacts --body="$BODY" --policy="${COHORT%-*}" --profile="${COHORT#*-}" --seeds=2 --seed-start=410000029 --seconds=660 --output=/tmp/policies.json 2>&1 | tee /tmp/policies.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/policies.log; then exit 1; fi
          python - <<'PY'
          import json, statistics as st
          d=json.load(open("/tmp/policies.json"))
          assert len(d["runs"])==72 and len(d["groups"])==36
          report={}
          for level in (1,2,3):
              for strategy in ("stationary","aggressive","kiting","explorer"):
                  rows=[r for r in d["runs"] if r["difficulty"]==level and r["strategy"]==strategy]
                  assert len(rows)==6
                  for r in rows:
                      assert len(r["artifacts"]["owned"])<=3
                      assert r["phenotype"]["body"]==r["body"] and r["phenotype"]["affinity"]==r["affinity"]
                      if d["profile"]=="generated": assert r["provenance"]["phenotype"]==r["phenotype"]
                  gen=sum(r["mana"]["generated"] for r in rows)
                  first=[r["first_upgrade"] for r in rows if r["first_upgrade"]>=0]
                  gaps=[b-a for r in rows for a,b in zip(r["level_times"],r["level_times"][1:])]
                  report[f"D{level}/{strategy}"]={"n":len(rows),"wins":sum(r["outcome"]=="Victory" for r in rows),"timeouts":sum(r["outcome"]=="Timeout" for r in rows),"boss_reach":sum(r["boss_reached"] for r in rows),"first_trial_clear":sum(r["trials"]["cleared"]>=1 for r in rows),"second_trial_clear":sum(r["trials"]["cleared"]==2 for r in rows),"mean_damage_taken":st.mean(r["taken"] for r in rows),"mean_seconds":st.mean(r["seconds"] for r in rows),"mana_fraction":sum(r["mana"]["collected"] for r in rows)/gen if gen else None,"first_upgrade_median":st.median(first) if first else None,"upgrade_gap_median":st.median(gaps) if gaps else None,"mean_artifacts":st.mean(len(r["artifacts"]["owned"]) for r in rows),"mean_dodge_decisions":st.mean(r["dodge_decisions"] for r in rows)}
          print(json.dumps(report,indent=2))
          with open("/tmp/policy-summary.json","w") as f: json.dump(report,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: policy-${{ matrix.cohort }}-${{ matrix.body }}
          path: |
            /tmp/policies.json
            /tmp/policy-summary.json
          if-no-files-found: error
          retention-days: 30
